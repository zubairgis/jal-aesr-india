name: Finalize Section 03 proposal figures

on:
  push:
    paths:
      - '.tmp/layout/finalize-section03.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put all proposal figures only in Section 03
        run: python .github/scripts/finalize_section03.py

      - name: Commit Section 03 figure layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No layout changes to commit.'
          else
            git commit -m 'Show all three proposal figures only under preliminary proof of need'
            git push
          fi
